name: Build Windows Cemu 2.6 AudioFix

on:
  push:
    branches: [main]
    paths:
      - 'patches/001-lego-audio-aux-fallback.patch'
      - 'tools/apply-lego-audio-audio-fix.py'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

concurrency:
  group: cemu-2.6-audiofix-full-build
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_REPO: harrysof/Cemu-2.6-Remote-Toypad-Build
  UPSTREAM_REF: main

defaults:
  run:
    shell: pwsh

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout AudioFix project
        uses: actions/checkout@v4

      - name: Checkout Harry Toypad Cemu 2.6 source
        shell: pwsh
        run: |
          $upstreamUrl = "https://github.com/$env:UPSTREAM_REPO.git"
          Write-Host "Cloning upstream source from $upstreamUrl"
          git clone --depth 1 --branch $env:UPstream_REF $upstreamUrl cemu-source
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone upstream Toypad source from $upstreamUrl" }

          $deps = @(
            @{ Path='dependencies/vcpkg'; Url='https://github.com/microsoft/vcpkg.git'; Ref='master'; Nested=$false },
            @{ Path='dependencies/imgui'; Url='https://github.com/ocornut/imgui.git'; Ref='f65bcf481ab34cd07d3909aab1479f409fa79f2f'; Nested=$false },
            @{ Path='dependencies/cubeb'; Url='https://github.com/mozilla/cubeb.git'; Ref='2071354a69aca7ed6df3b4222e305746c2113f60'; Nested=$true },
            @{ Path='dependencies/Vulkan-Headers'; Url='https://github.com/KhronosGroup/Vulkan-Headers.git'; Ref='01393c3df0e5285b54ee6527466513f9e614be94'; Nested=$false },
            @{ Path='dependencies/ZArchive'; Url='https://github.com/Exzap/ZArchive.git'; Ref='d2c717730092c7bf8cbb033b12fd4001b7c4d932'; Nested=$false }
          )

          foreach ($dep in $deps) {
            $target = Join-Path 'cemu-source' $dep.Path
            if (-not (Test-Path (Join-Path $target '.git'))) {
              if (Test-Path $target) { Remove-Item -Recurse -Force $target }
              Write-Host "Cloning $($dep.Path)"
              git clone $dep.Url $target
              if ($LASTEXITCODE -ne 0) { throw "Failed to clone $($dep.Path)" }
            }

            Write-Host "Pinning $($dep.Path) to $($dep.Ref)"
            if ($dep.Ref -eq 'master') {
              git -C $target fetch --depth 1 origin master
              if ($LASTEXITCODE -ne 0) { throw "Failed to fetch master for $($dep.Path)" }
              git -C $target checkout --detach origin/master
            } else {
              git -C $target fetch --depth 1 origin $dep.Ref
              if ($LASTEXITCODE -ne 0) { throw "Failed to fetch $($dep.Ref) for $($dep.Path)" }
              git -C $target checkout --detach $dep.Ref
            }
            if ($LASTEXITCODE -ne 0) { throw "Failed to checkout $($dep.Ref) for $($dep.Path)" }

            if ($dep.Nested) {
              git -C $target submodule update --init --recursive
              if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize cubeb nested submodules' }
            }
          }

          $required = @(
            'dependencies/vcpkg/bootstrap-vcpkg.bat',
            'dependencies/imgui/imgui.h',
            'dependencies/cubeb/include/cubeb/cubeb.h',
            'dependencies/Vulkan-Headers/include/vulkan/vulkan.h',
            'dependencies/ZArchive/CMakeLists.txt'
          )
          foreach ($path in $required) {
            $full = Join-Path $env:GITHUB_WORKSPACE (Join-Path 'cemu-source' $path)
            if (-not (Test-Path $full)) { throw "Required dependency file is missing: $full" }
            Write-Host "Verified $path"
          }

      - name: Apply consolidated LEGO audio source fixes
        shell: pwsh
        run: |
          python tools/apply-lego-audio-audio-fix.py
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply consolidated LEGO audio source fixes' }
          Push-Location cemu-source
          git diff --check
          Pop-Location

      - name: Setup MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify MSVC and x64 MASM tools
        shell: pwsh
        run: |
          Write-Host "C/C++ compiler:"
          $cl = Get-Command cl.exe -ErrorAction Stop
          $cl.Source
          Write-Host "x64 MASM assembler:"
          $ml64 = Get-Command ml64.exe -ErrorAction Stop
          $ml64.Source
          Write-Host "Compiler tool versions:"
          cl.exe 2>&1 | Select-Object -First 2
          ml64.exe 2>&1 | Select-Object -First 2

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Ensure Ninja
        shell: pwsh
        run: |
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if (-not $ninja) {
            python -m pip install ninja
            if ($LASTEXITCODE -ne 0) { throw 'Failed to install Ninja' }
          }
          ninja --version

      - name: Bootstrap vcpkg
        shell: cmd
        working-directory: cemu-source
        run: dependencies\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Setup MSVC for CMake configure
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Cemu
        shell: pwsh
        working-directory: cemu-source
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_ASM_MASM_COMPILER=ml64.exe -DVCPKG_INSTALL_OPTIONS="--clean-after-build"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }

      - name: Setup MSVC for Cemu build
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Cemu
        shell: pwsh
        working-directory: cemu-source
        run: |
          $ml64 = Get-Command ml64.exe -ErrorAction Stop
          Write-Host "Using MASM: $($ml64.Source)"
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Cemu build failed' }

      - name: Verify executable
        shell: pwsh
        working-directory: cemu-source
        run: |
          if (-not (Test-Path 'bin/Cemu_release.exe')) { throw 'Cemu_release.exe was not produced' }
          Get-Item 'bin/Cemu_release.exe' | Format-List FullName,Length,LastWriteTime

      - name: Package test artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item cemu-source/bin/Cemu_release.exe artifact/Cemu_release.exe
          @'
          @echo off
          echo LEGO Dimensions AudioFix - LPF + stereo fold-down + AUX fallback
          echo.
          echo Default: LPF fix enabled, AUX fallback enabled, TV stereo fold-down enabled.
          echo Optional: set CEMU_LEGO_AUDIO_AUX_FALLBACK=0 to disable AUX fallback.
          echo Optional: set CEMU_LEGO_TV_FC_DIAG=1 for center-only stereo diagnostics.
          echo.
          Cemu_release.exe
          '@ | Set-Content -Encoding ASCII artifact/run-lego-audio-test.cmd
          @'
          Cemu 2.6 Toypad - LEGO gameplay audio fix build

          Base: harrysof/Cemu-2.6-Remote-Toypad-Build
          Source fixes:
            1. AX per-voice low-pass sign and state-scaling correction.
            2. TV stereo fold-down of L/R + Center + matching surrounds.
            3. AUX TV fallback enabled by default when no callback is registered.

          Runtime diagnostics:
            CEMU_LEGO_AUDIO_AUX_FALLBACK=0 disables the AUX fallback.
            CEMU_LEGO_TV_FC_DIAG=1 selects center-only stereo output for diagnostics.

          This build is intended for LEGO Dimensions gameplay audio validation.
          '@ | Set-Content -Encoding UTF8 artifact/README-AUDIO-TEST.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-2.6-Toypad-LEGO-AudioFix-Windows-x64
          path: artifact
          if-no-files-found: error
          retention-days: 14
